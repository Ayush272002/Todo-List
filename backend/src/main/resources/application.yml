spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${SPRING_JPA_SHOW_SQL}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}

server:
  port: ${SERVER_PORT}
  servlet:
    session:
      cookie:
        name: ${SERVER_SERVLET_SESSION_COOKIE_NAME}
        http-only: ${SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY}
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE}
        same-site: ${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE}

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN}
